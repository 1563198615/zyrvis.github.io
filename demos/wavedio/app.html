<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavedio — AI 收音机</title>
<meta name="description" content="Wavedio Web App — 9 个频道 · 9 位 AI 主播 · 24 小时不打烊">
<meta name="theme-color" content="#FFD93D">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --ink: #1E1E2E;
    --paper: #FFF6E9;
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif;
    background: #EFE6DA;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    overflow: hidden;
  }

  .device {
    width: min(420px, 100vw);
    height: min(880px, 100vh);
    background: var(--paper);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (min-width: 480px) and (min-height: 920px) {
    .device { border-radius: 40px; border: 6px solid var(--ink); box-shadow: 12px 12px 0 rgba(30,30,46,0.25); }
  }

  /* ============ 通用：海报贴纸元素 ============ */
  .sticker {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 50px;
    padding: 5px 14px;
    font-size: 0.72rem; font-weight: 800;
    box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-2deg);
  }
  .nbtn {
    border: 3px solid var(--ink);
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.15s var(--ease-spring), box-shadow 0.15s;
    color: var(--ink);
  }
  .nbtn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
  .nbtn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }

  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-8px) rotate(var(--r,0deg)); } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }

  /* ============ 首页 Header ============ */
  .home-header {
    padding: 18px 18px 8px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .logo-lockup .t1 { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .logo-lockup .t1 em { font-style: normal; color: #FF6B6B; text-shadow: 2px 2px 0 #FFD93D; }
  .logo-lockup .t2 { font-size: 0.7rem; font-weight: 800; color: rgba(30,30,46,0.6); margin-top: 4px; letter-spacing: 0.12em; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .timer-pill {
    background: var(--ink); color: #FFE66D;
    font-size: 0.78rem; font-weight: 800;
    padding: 5px 12px; border-radius: 50px;
    font-variant-numeric: tabular-nums;
  }

  /* ============ 首页：频道海报网格 ============ */
  .grid-title { padding: 6px 20px 10px; font-size: 0.82rem; font-weight: 800; color: rgba(30,30,46,0.55); }
  .channel-grid {
    flex: 1;
    overflow-y: auto;
    padding: 4px 18px 90px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-content: start;
  }
  .gcard {
    border: 3px solid var(--ink);
    border-radius: 22px;
    padding: 12px 12px 12px;
    cursor: pointer;
    position: relative;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.18s var(--ease-spring), box-shadow 0.18s;
    overflow: hidden;
  }
  .gcard:nth-child(odd) { transform: rotate(-1deg); }
  .gcard:nth-child(even) { transform: rotate(1deg); }
  .gcard:hover { transform: translate(-2px,-2px) rotate(0deg); box-shadow: 7px 7px 0 var(--ink); }
  .gcard:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .gcard .illus { height: 86px; display: flex; align-items: center; justify-content: center; }
  .gcard .illus svg { width: 78px; height: 78px; }
  .gcard .nm { font-size: 0.95rem; font-weight: 900; margin-top: 6px; }
  .gcard .hs { font-size: 0.68rem; font-weight: 700; opacity: 0.75; }
  .gcard .freq {
    position: absolute; top: 8px; right: 10px;
    font-size: 0.62rem; font-weight: 900; opacity: 0.6;
    font-variant-numeric: tabular-nums;
  }
  /* 第一张卡占两栏做主打 */
  .gcard.hero-card { grid-column: span 2; display: flex; align-items: center; gap: 14px; }
  .gcard.hero-card .illus { height: 104px; }
  .gcard.hero-card .illus svg { width: 100px; height: 100px; }
  .gcard.hero-card .nm { font-size: 1.35rem; }
  .gcard.hero-card .hs { font-size: 0.75rem; }
  .gcard .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #FF4757; margin-right: 5px;
    animation: bob 1s ease-in-out infinite;
  }

  /* 首页底部装饰涂鸦 */
  .doodle { position: absolute; pointer-events: none; z-index: 0; animation: floaty 5s ease-in-out infinite; }

  /* ============ 播放器：全屏海报 ============ */
  .player {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    overflow: hidden;
  }
  .player.open { display: flex; }

  .p-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 16px 4px;
    position: relative; z-index: 3;
  }
  .p-back { width: 44px; height: 44px; }
  .p-back svg { width: 20px; height: 20px; }
  .p-freq { font-weight: 900; font-size: 0.85rem; background: #fff; border: 2.5px solid var(--ink); border-radius: 50px; padding: 6px 14px; box-shadow: 3px 3px 0 var(--ink); }

  /* 大海报插画区 */
  .p-poster {
    flex: 1;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .p-poster .big-illus { width: 78%; max-width: 300px; position: relative; z-index: 2; animation: floaty 6s ease-in-out infinite; }
  .p-shape { position: absolute; pointer-events: none; z-index: 1; }

  /* 主播贴纸 */
  .p-host-sticker {
    position: absolute; top: 6px; left: 18px; z-index: 4;
    transform: rotate(-4deg);
    font-size: 0.78rem;
  }

  /* 信息区 */
  .p-info {
    position: relative; z-index: 3;
    background: #fff;
    border-top: 3px solid var(--ink);
    padding: 18px 20px 22px;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -6px 0 rgba(30,30,46,0.08);
  }
  .p-track { font-size: 1.35rem; font-weight: 900; letter-spacing: -0.3px; }
  .p-artist { font-size: 0.82rem; font-weight: 700; color: rgba(30,30,46,0.6); margin-top: 2px; }
  .p-theme { font-size: 0.72rem; font-weight: 800; color: rgba(30,30,46,0.5); margin-top: 6px; letter-spacing: 0.02em; }

  /* 进度：虚线趣味条 */
  .p-progress { display: flex; gap: 5px; margin: 14px 0 14px; }
  .p-progress i {
    flex: 1; height: 8px; border-radius: 4px;
    background: rgba(30,30,46,0.1);
    transition: background 0.3s;
  }
  .p-progress i.on { background: var(--ink); }

  /* 串词：漫画气泡 */
  .p-bubble {
    position: relative;
    border: 2.5px solid var(--ink);
    border-radius: 18px;
    background: #FFF9F0;
    padding: 12px 14px;
    margin-bottom: 16px;
    min-height: 76px;
    box-shadow: 4px 4px 0 rgba(30,30,46,0.15);
  }
  .p-bubble::before {
    content: '';
    position: absolute; top: -11px; left: 28px;
    width: 16px; height: 16px;
    background: #FFF9F0;
    border-left: 2.5px solid var(--ink);
    border-top: 2.5px solid var(--ink);
    transform: rotate(45deg);
  }
  .p-bubble .who { font-size: 0.66rem; font-weight: 900; letter-spacing: 0.06em; margin-bottom: 4px; }
  .p-bubble .line { font-size: 0.86rem; font-weight: 600; line-height: 1.55; transition: opacity 0.35s; }
  .p-bubble .line.fading { opacity: 0; }

  /* 控制按钮 */
  .p-controls { display: flex; justify-content: center; align-items: center; gap: 22px; }
  .c-next { width: 52px; height: 52px; border-radius: 18px; }
  .c-next svg { width: 22px; height: 22px; }
  .c-play {
    width: 72px; height: 72px;
    border-radius: 50%;
    border-width: 3.5px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .c-play svg { width: 30px; height: 30px; }
  .p-hint { text-align: center; font-size: 0.66rem; font-weight: 700; color: rgba(30,30,46,0.45); margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<div class="device" id="device">

    </div>
    <div class="grid-title">9 个频道 · 9 位主播 · 24 小时不打烊</div>

  <!-- ============ 播放器 ============ -->
  <div class="player" id="player">

    <div class="p-poster" id="pPoster">

      <div class="big-illus" id="pIllus"></div>
    </div>
    <div class="p-info">
      <div class="p-track" id="pTrack">—</div>
      <div class="p-artist" id="pArtist">—</div>
      <div class="p-theme" id="pTheme"></div>

      <div class="p-bubble">
        <div class="who" id="pWho">主播 · 正在说</div>
        <div class="line" id="pLine"></div>
      </div>
      <div class="p-controls">
        <button class="nbtn c-next" id="nextBtn" title="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="nbtn c-play" id="playBtn" title="播放/暂停">
          <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icPause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="nbtn c-next" id="chBtn" title="换个频道">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 4h16v12H4z"/><path d="M8 20h8"/><path d="M8 8l3 3-3 3"/></svg>
        </button>
      </div>
      <div class="p-hint">← 返回频道墙 · 气泡里主播正在唠嗑</div>
    </div>
  </div>
</div>

<audio id="audioEl" preload="none"></audio>

  /* 扩充歌池：每台 5+3=8 首，节目随机抽 4-6 首 */
  var EXTRA_TRACKS = {

  CHANNELS.forEach(function (c) { c.tracks = c.tracks.concat(EXTRA_TRACKS[c.id] || []); });

  /* ================= 状态 ================= */
  var cur = -1, playing = false, timerSec = 0, progress = 0;
  var tickTimer = null;
  var PROGRESS_SEGS = 24;

  var $ = function (id) { return document.getElementById(id); };

  /* ================= 首页渲染 ================= */
  function renderGrid() {
    var html = '';
    CHANNELS.forEach(function (c, i) {
      var cls = i === 0 ? 'gcard hero-card' : 'gcard';

  /* ================= 播放器 ================= */
  function renderProgress() {
    var html = '';
    var on = Math.round(progress / 100 * PROGRESS_SEGS);
    for (var i = 0; i < PROGRESS_SEGS; i++) html += '<i class="' + (i < on ? 'on' : '') + '"></i>';

  function renderPlayer() {
    var c = CHANNELS[cur];
    $('player').style.background = c.color;
    $('pFreq').textContent = c.freq;
    $('pHostSticker').textContent = '🎙 ' + c.host + ' · ' + c.persona;

  /* ============ 电台引擎：节目在后台持续运行，切入即中途收听（不受进入时间影响） ============ */
  var stations = {};   // chId -> { program, segIdx, segMs, nextProgram }
  var TALK_MIN = 7000, TALK_VAR = 5000, SONG_MIN = 30000, SONG_VAR = 35000;

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function talkDur() { return TALK_MIN + Math.floor(Math.random() * TALK_VAR); }
  function songDur() { return SONG_MIN + Math.floor(Math.random() * SONG_VAR); }

  /* 本地模拟 LLM：主题 → 选 4-6 首 → 开场/串词/结尾（结构与后端输出一致） */
  function localProgram(c) {
    var theme = pick(c.themes);
    var songs = shuffle(c.tracks.slice()).slice(0, 4 + Math.floor(Math.random() * 3));
    var transitions = ['歌声还没散，故事继续。', '上一首的余温还在，下一首已经就位。', '别换台，精彩接着来。', '广告之后……开玩笑的，我们没有广告。'];
    var segs = [{ type: 'talk', dur: talkDur(), text: '你好，我是' + c.host + '。欢迎收听' + c.name + '。这档节目的主题是「' + theme[0] + '」——' + theme[1] + '。' }];
    songs.forEach(function (t, i) {
      // 不是每首歌都讲故事（约 1/3 的歌直接连播）
      if (i === 0 || Math.random() > 0.33) {
        var intro = c.lines[i % c.lines.length];
        segs.push({ type: 'talk', dur: talkDur(), text: (i === 0 ? '先来第一首，' : pick(transitions) + '接下来，') + '来自' + t[1] + '的《' + t[0] + '》。' + intro });
      }
      segs.push({ type: 'song', dur: songDur(), track: t });
    });
    segs.push({ type: 'talk', dur: talkDur(), text: '「' + theme[0] + '」就播到这里。我是' + c.host + '，' + c.name + ' 24 小时不打烊，下一档马上就来。' });
    return { theme: theme, segments: segs };
  }

  /* 后端节目编排接口（可选）：成功后作为该台的下一档节目 */
  function generateProgram(c) {
    if (!API_BASE) return Promise.reject(new Error('no API_BASE'));
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 5000);
    return fetch(API_BASE + '/stations/' + c.id + '/program', { signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
      .then(function (p) {
        clearTimeout(to);
        return { theme: Array.isArray(p.theme) ? p.theme : [p.theme || '今日精选', ''], segments: p.segments || [] };
      })
      .catch(function (e) { clearTimeout(to); throw e; });
  }

  function prefetchProgram(st, c) {
    generateProgram(c).then(function (p) { st.nextProgram = p; }).catch(function () { /* 下档继续用本地编排 */ });
  }

  function stationAdvance(st, c) {
    st.segIdx++;
    st.segMs = 0;
    if (st.segIdx >= st.program.segments.length) {
      st.program = st.nextProgram || localProgram(c);
      st.nextProgram = null;
      st.segIdx = 0;
      prefetchProgram(st, c);
    }
  }

  /* 初始化：每个台立即生成节目并随机进度（模拟"电台一直在播"） */
  function initStations() {
    CHANNELS.forEach(function (c) {
      if (stations[c.id]) return;
      var st = { program: localProgram(c), segIdx: 0, segMs: 0, nextProgram: null };
      var songIdxs = st.program.segments.map(function (s, i) { return s.type === 'song' ? i : -1; }).filter(function (i) { return i >= 0; });
      var idx = (Math.random() < 0.7 && songIdxs.length) ? pick(songIdxs) : Math.floor(Math.random() * st.program.segments.length);
      st.segIdx = idx;
      st.segMs = Math.floor(Math.random() * st.program.segments[idx].dur * 0.85);
      stations[c.id] = st;
      prefetchProgram(st, c);
    });
  }

  /* ============ 播放器 UI 同步（只渲染当前台的后台状态） ============ */
  var renderedSeg = -2, renderedProgram = null;

  function syncPlayerUI(force) {
    if (cur < 0) return;
    var c = CHANNELS[cur], st = stations[c.id];
    var seg = st.program.segments[st.segIdx];
    progress = Math.min(100, st.segMs / seg.dur * 100);
    renderProgress();
    if (!force && st.segIdx === renderedSeg && st.program === renderedProgram) return;
    renderedSeg = st.segIdx;
    renderedProgram = st.program;
    if (seg.type === 'song') {
      cancelSpeech(st);   // 歌曲段：主播闭嘴
      $('pTrack').textContent = seg.track[0];
      $('pArtist').textContent = seg.track[1] + (c.streamUrl ? '' : ' · 30s 试听');
      // 切入一首没有串词的歌时，气泡给一句兜底台呼
      var prev = st.program.segments[st.segIdx - 1];
      if (!prev || prev.type !== 'talk') {
        setBubble('🎵 正在直播「' + st.program.theme[0] + '」，我是' + c.host + '，陪你一起听。');
      }
      loadTrackAudio(seg.track, st);
    } else {
      $('pTrack').textContent = st.program.theme[0];
      $('pArtist').textContent = '主播时间 · ' + c.host;
      setBubble(seg.text);
      if (playing) speakLine(seg.text, c, st);   // 主播开口念串词
    }
    var total = st.program.segments.filter(function (s) { return s.type === 'song'; }).length;
    var played = st.program.segments.slice(0, st.segIdx + 1).filter(function (s) { return s.type === 'song'; }).length;
    $('pTheme').textContent = '「' + st.program.theme[0] + '」' +
      (seg.type === 'song' ? ' · 第 ' + played + '/' + total + ' 首' : ' · 主播时间');
  }

  function setBubble(text) {
    var el = $('pLine');
    el.classList.add('fading');
    setTimeout(function () { el.textContent = '“' + text + '”'; el.classList.remove('fading'); }, 350);
  }

  function openPlayer(i) {
    cur = i;
    renderedSeg = -2;
    renderedProgram = null;
    renderPlayer();
    $('home').style.display = 'none';
    $('player').classList.add('open');
    syncPlayerUI(true);
    setPlaying(true);

  function closePlayer() {
    $('player').classList.remove('open');
    $('home').style.display = 'flex';
    cur = -1;
    setPlaying(false);   // 你只是停止收听，电台继续在后台跑
  }

  function setPlaying(on) {
    playing = on;
    $('icPlay').style.display = on ? 'none' : 'block';
    $('icPause').style.display = on ? 'block' : 'none';
    if (!on) {
      cancelSpeech(cur >= 0 ? stations[CHANNELS[cur].id] : null);
      $('audioEl').pause();
    } else {
      var audioEl = $('audioEl');
      if (audioEl.src) audioEl.play().catch(function () {});
    }
  }

  /* ============ 真实音频：iTunes 30s 预览（API 无鉴权、CORS 开放；频道带 streamUrl 时优先用流） ============ */
  var previewCache = {};   // 'title|artist' -> url | null
  var audioToken = 0;

  /* JSONP：绕过 file:// origin=null 时 iTunes 的 CORS 限制 */
  var jsonpCbId = 0;
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var cb = '__wavedioCb' + (++jsonpCbId);
      var s = document.createElement('script');
      var done = false;
      function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
      window[cb] = function (data) { done = true; cleanup(); resolve(data); };
      s.onerror = function () { cleanup(); reject(new Error('jsonp failed')); };
      s.src = url + '&callback=' + cb;
      document.head.appendChild(s);
      setTimeout(function () { if (!done) { cleanup(); reject(new Error('jsonp timeout')); } }, 6000);
    });
  }

  function resolveTrackUrl(track) {
    var key = track[0] + '|' + track[1];
    if (key in previewCache) return Promise.resolve(previewCache[key]);
    return jsonp('https://itunes.apple.com/search?term=' + encodeURIComponent(track[0] + ' ' + track[1]) + '&media=music&entity=song&limit=1')
      .then(function (d) {
        var url = (d.results && d.results[0] && d.results[0].previewUrl) || null;
        previewCache[key] = url;
        return url;
      })
      .catch(function () { previewCache[key] = null; return null; });
  }

  function loadTrackAudio(track, st) {
    var audioEl = $('audioEl');
    var chan = CHANNELS[cur];
    var token = ++audioToken;
    audioEl.pause();
    audioEl.removeAttribute('src');

    function useUrl(url) {
      if (token !== audioToken || !url) return;   // 已切段/切台，或解析失败（静默走模拟时长）
      audioEl.src = url;
      audioEl.onloadedmetadata = function () {
        if (token !== audioToken) return;
        var segNow = st.program.segments[st.segIdx];
        if (segNow && segNow.type === 'song') {
          segNow.dur = Math.round(audioEl.duration * 1000);   // 段时长改为真实音轨时长
          var seek = st.segMs / 1000;
          if (seek > 1 && seek < audioEl.duration - 1) audioEl.currentTime = seek;   // 中途切入：对齐电台进度
        }
        if (playing) audioEl.play().catch(function () {});
      };
      audioEl.onended = function () {
        if (token !== audioToken) return;
        stationAdvance(st, chan);   // 播完推进到下一段（tick 里的模拟时长做兜底）
      };
      if (playing) audioEl.play().catch(function () {});
    }

    if (chan.streamUrl) { useUrl(chan.streamUrl); return; }
    resolveTrackUrl(track).then(useUrl);
  }

  /* ============ 主播 TTS：Web Speech API（零成本；talk 段由朗读驱动，模拟时长兜底） ============ */
  var speechVoice = null;
  var HOST_VOICE = {   // 主播声线：pitch/rate 区分人设
    '老爵士': { pitch: 0.7, rate: 0.82 },
    '阿杰': { pitch: 0.9, rate: 1.12 },
    '苏苏': { pitch: 1.12, rate: 0.85 },
    '小北': { pitch: 1.3, rate: 1.08 },
    '阿Rock': { pitch: 0.72, rate: 0.92 },
    '云朵': { pitch: 1.2, rate: 0.88 },
    '电波': { pitch: 1.0, rate: 1.15 },
    '老马': { pitch: 0.78, rate: 0.88 },
    '奈奈': { pitch: 1.25, rate: 1.05 }
  };

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices();
    speechVoice = vs.find(function (v) { return /zh[-_]CN/i.test(v.lang); })
      || vs.find(function (v) { return /^zh/i.test(v.lang); }) || null;
  }

  function cancelSpeech(st) {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (st) st.speaking = false;
  }

  function speakLine(text, c, st) {
    if (!('speechSynthesis' in window)) return false;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/[「」《》🎵]/g, ''));
    if (speechVoice) u.voice = speechVoice;
    u.lang = 'zh-CN';
    var cfg = HOST_VOICE[c.host] || {};
    u.pitch = cfg.pitch || 1;
    u.rate = cfg.rate || 1;
    var prog = st.program, idx = st.segIdx;
    var done = false;
    var finish = function () {
      if (done) return;
      done = true;
      st.speaking = false;
      // 只在该台仍停留在这一段时推进（防串段）
      if (st.program === prog && st.segIdx === idx) stationAdvance(st, c);
    };
    u.onend = finish;
    u.onerror = finish;
    st.speaking = true;
    speechSynthesis.speak(u);
    return true;
  }

  function nextTrack() {
    if (cur < 0) return;
    var c = CHANNELS[cur];
    stationAdvance(stations[c.id], c);   // 跳过当前段
    syncPlayerUI(true);
  }

  function nextChannel() {
    if (cur < 0) return;
    openPlayer((cur + 1) % CHANNELS.length);
  }

  function tick() {
    if (playing) {
      timerSec++;
      var h = String(Math.floor(timerSec / 3600)).padStart(2, '0');
      var m = String(Math.floor(timerSec % 3600 / 60)).padStart(2, '0');
      var s = String(timerSec % 60).padStart(2, '0');
      $('timer').textContent = h + ':' + m + ':' + s;
    }
    // 所有台在后台持续运行，与是否打开播放器无关
    CHANNELS.forEach(function (c) {
      var st = stations[c.id];
      if (!st) return;
      st.segMs += 1000;
      var segNow = st.program.segments[st.segIdx];
      // talk 段朗读未完时 hold 住（25s 硬上限防卡死）
      var hold = segNow.type === 'talk' && st.speaking && st.segMs < 25000;
      if (!hold && st.segMs >= segNow.dur) stationAdvance(st, c);
    });
    if (cur >= 0) syncPlayerUI(false);
  }

  /* ================= 事件 ================= */
  $('backBtn').addEventListener('click', closePlayer);
  $('playBtn').addEventListener('click', function () { setPlaying(!playing); });
  $('nextBtn').addEventListener('click', nextTrack);
  $('chBtn').addEventListener('click', nextChannel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePlayer();
    if (e.key === ' ' && cur >= 0) { e.preventDefault(); setPlaying(!playing); }
    if (e.key === 'ArrowRight') nextChannel();
    if (e.key === 'ArrowLeft' && cur >= 0) openPlayer((cur + CHANNELS.length - 1) % CHANNELS.length);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearInterval(tickTimer);
    else tickTimer = setInterval(tick, 1000);
  });

  /* 日期贴纸 */
  (function () {
    var d = new Date();
    var days = ['日','一','二','三','四','五','六'];
    $('dateSticker').textContent = '📻 ' + (d.getMonth()+1) + '月' + d.getDate() + '日 周' + days[d.getDay()];
  })();

  /* ============ 启动：优先后端 API（2.5s 超时），失败降级内置数据 ============ */
  var API_BASE = '';  // 后端地址，如 'http://localhost:3000'；为空直接用内置数据

  function mapStation(s) {
    return {
      id: s.id,
      name: s.name,
      freq: s.frequency || s.freq || '',
      host: (s.currentHost && s.currentHost.name) || s.host || 'AI 主播',
      persona: (s.currentHost && s.currentHost.persona) || s.persona || '',
      color: s.color || '#FFD93D',
      illus: s.illustration || s.illus || 'disco',
      tracks: (s.tracks || []).map(function (t) { return Array.isArray(t) ? t : [t.title, t.artist]; }),
      lines: s.scripts || s.lines || [],
      themes: s.themes || [['今日精选', '']],
      streamUrl: s.streamUrl || null
    };
  }

  function init() {
    pickVoice();   // TTS 语音（部分浏览器异步加载，onvoiceschanged 兜底）
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;
    initStations();   // 电台引擎先行：所有台立即开播（随机进度）
    renderGrid();
    tickTimer = setInterval(tick, 1000);
    if (!API_BASE) return;
    var ctrl = new AbortController();
    setTimeout(function () { ctrl.abort(); }, 2500);
    fetch(API_BASE + '/stations', { signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
      .then(function (list) {
        if (!Array.isArray(list) || !list.length) return;
        CHANNELS = list.map(mapStation);
        initStations();
        renderGrid();
        if (cur >= 0) renderPlayer();
      })
      .catch(function () { /* 静默降级为内置数据 */ });
  }

  init();
})();
</script>
</body>
</html>
