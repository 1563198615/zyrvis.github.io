<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FitMap — 3D 人体肌肉</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif}
  body{background:#0A0A14;color:#fff}
  #c{position:fixed;inset:0}

  .topbar{position:fixed;top:0;left:0;right:0;padding:14px 20px;background:linear-gradient(180deg,rgba(10,10,20,.95),transparent);z-index:10;pointer-events:none}
  .topbar h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#FF4757,#FF6B7A);-webkit-background-clip:text;color:transparent}
  .topbar p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}

  .btnbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;background:rgba(20,20,40,.85);backdrop-filter:blur(20px);padding:8px;border-radius:14px;border:1px solid rgba(255,255,255,.08)}
  .btnbar button{padding:8px 14px;border:none;border-radius:8px;background:transparent;color:#fff;font-size:12px;cursor:pointer;transition:.2s}
  .btnbar button.on{background:#FF4757;box-shadow:0 0 12px rgba(255,71,87,.5)}
  .btnbar button:hover:not(.on){background:rgba(255,255,255,.08)}
  .btnbar .sep{width:1px;background:rgba(255,255,255,.1);margin:4px}

  .legend{position:fixed;top:20px;right:20px;background:rgba(20,20,40,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;font-size:11px;z-index:10}
  .legend .item{display:flex;align-items:center;gap:8px;padding:3px 0}
  .legend .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor}

  .info{position:fixed;bottom:80px;left:20px;background:rgba(20,20,40,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;width:240px;z-index:10;display:none}
  .info.show{display:block;animation:slideIn .3s}
  @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
  .info h3{font-size:14px;margin-bottom:4px}
  .info .state{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;margin:6px 0 10px}
  .info .bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  .info .bar div{height:100%;background:linear-gradient(90deg,#FF4757,#FFA502,#2ED573);transition:.3s}
  .info .pct{font-size:10px;color:rgba(255,255,255,.5);margin-top:4px}
  .info ul{list-style:none;margin-top:8px}
  .info li{font-size:11px;color:rgba(255,255,255,.6);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}

  .hint{position:fixed;bottom:80px;right:20px;font-size:11px;color:rgba(255,255,255,.4);text-align:right;z-index:10}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
  .toast.show{opacity:1}

  #status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:100}
  #status .ring{width:40px;height:40px;border:3px solid rgba(255,71,87,.2);border-top-color:#FF4757;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  #status .msg{font-size:13px;color:rgba(255,255,255,.6)}
  #status.err .ring{border-top-color:#FF4757}
  #status.err .msg{color:#FF4757}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="status"><div class="ring"></div><div class="msg" id="status-msg">加载 3D 引擎...</div></div>

<div class="topbar" style="display:none" id="topbar">
  <h1>🏋️ FitMap 3D 人体肌肉</h1>
  <p>拖动旋转 · 滚轮缩放 · 点击肌肉切换状态</p>
</div>

<div class="legend" style="display:none" id="legend">
  <div class="item"><span class="dot" style="background:#FF4757;color:#FF4757"></span>今日训练 (3)</div>
  <div class="item"><span class="dot" style="background:#FFA502;color:#FFA502"></span>恢复中 (3)</div>
  <div class="item"><span class="dot" style="background:#2ED573;color:#2ED573"></span>可训练 (11)</div>
</div>

<div id="c"></div>

<div class="info" id="info">
  <h3 id="i-name">-</h3>
  <span class="state" id="i-state">-</span>
  <div class="bar"><div id="i-bar" style="width:50%"></div></div>
  <div class="pct" id="i-pct">-</div>
  <ul id="i-ex"></ul>
</div>

<div class="hint" style="display:none" id="hint">🖱 左键拖动旋转<br>🔍 滚轮缩放<br>👆 点击肌肉</div>

<div class="btnbar" style="display:none" id="btnbar">
  <button class="on" id="b-front" onclick="setView('front')">正面</button>
  <button id="b-back" onclick="setView('back')">背面</button>
  <span class="sep"></span>
  <button class="on" id="b-male" onclick="setGender('male')">♂ 男</button>
  <button id="b-female" onclick="setGender('female')">♀ 女</button>
  <span class="sep"></span>
  <button id="b-spin" onclick="toggleSpin()">↻ 自转</button>
</div>

<div class="toast" id="toast"></div>

<!-- Local Three.js -->
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>

<script>
function setStatus(msg, err) {
  const el = document.getElementById('status');
  document.getElementById('status-msg').textContent = msg;
  if (err) el.classList.add('err'); else el.classList.remove('err');
}
function hideStatus() {
  document.getElementById('status').style.display = 'none';
  ['topbar','legend','hint','btnbar'].forEach(id => document.getElementById(id).style.display = '');
}

// Check THREE loaded
if (typeof THREE === 'undefined') {
  setStatus('❌ Three.js 加载失败，请检查 vendor/three.min.js', true);
  throw new Error('THREE not loaded');
}
if (typeof THREE.OrbitControls === 'undefined') {
  setStatus('❌ OrbitControls 加载失败，请检查 vendor/OrbitControls.js', true);
  throw new Error('OrbitControls not loaded');
}

setStatus('构建 3D 模型...');

// ========== Constants ==========
const STATE_HEX = { trained: 0xFF4757, recovering: 0xFFA502, ready: 0x2ED573 };
const STATE_NAME = { trained:'今日训练', recovering:'恢复中', ready:'可训练' };
const CYCLE = { ready:'recovering', recovering:'trained', trained:'ready' };

let scene, camera, renderer, controls;
let bodyGroup, muscles = {};
let gender = 'male';

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0A0A14);
  scene.fog = new THREE.Fog(0x0A0A14, 8, 25);

  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 1.3, 4.5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('c').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 1.2, 0);
  controls.minDistance = 2.5;
  controls.maxDistance = 10;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.0;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x4488ff, 0.3));

  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(3, 5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -3;
  key.shadow.camera.right = 3;
  key.shadow.camera.top = 3;
  key.shadow.camera.bottom = -3;
  scene.add(key);

  const rim = new THREE.DirectionalLight(0xFF4757, 0.6);
  rim.position.set(-3, 3, -3);
  scene.add(rim);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(2, 64),
    new THREE.MeshStandardMaterial({ color: 0x14142A, metalness: 0.3, roughness: 0.6 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.3, 1.4, 64),
    new THREE.MeshBasicMaterial({ color: 0xFF4757, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.005;
  scene.add(ring);

  buildBody();

  // Interactions
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hover = null;

  renderer.domElement.style.cursor = 'grab';

  renderer.domElement.addEventListener('pointermove', e => {
    mouse.x = (e.clientX/innerWidth)*2-1;
    mouse.y = -(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse, camera);
    const allMeshes = [];
    for (const id in muscles) {
      const m = muscles[id];
      if (Array.isArray(m)) allMeshes.push(...m); else allMeshes.push(m);
    }
    const hits = ray.intersectObjects(allMeshes);
    if (hover) { hover.scale.set(1,1,1); hover = null; }
    if (hits.length > 0) {
      hover = hits[0].object;
      hover.scale.set(1.1, 1.1, 1.1);
      renderer.domElement.style.cursor = 'pointer';
    } else {
      renderer.domElement.style.cursor = 'grab';
    }
  });

  renderer.domElement.addEventListener('click', e => {
    mouse.x = (e.clientX/innerWidth)*2-1;
    mouse.y = -(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse, camera);
    const allMeshes = [];
    for (const id in muscles) {
      const m = muscles[id];
      if (Array.isArray(m)) allMeshes.push(...m); else allMeshes.push(m);
    }
    const hits = ray.intersectObjects(allMeshes);
    if (hits.length > 0) {
      const m = hits[0].object.userData.def;
      const newState = CYCLE[m.state];
      m.state = newState;
      m.recovery = newState === 'trained' ? 0.05 : newState === 'recovering' ? 0.5 : 1;
      updateMuscleColor(m.id, newState);
      showInfo(m);
      toast(`${m.cn} → ${STATE_NAME[newState]}`);
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  showInfo(MUSCLES[0]);
  hideStatus();
  console.log('✓ FitMap 3D body loaded with', MUSCLES.length, 'muscles');
}

function disposeGroup(g) {
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  scene.remove(g);
}

// ========== Muscle Data ==========
const MUSCLES = [
  // FRONT
  { id:'chest',      s:'胸',  cn:'胸大肌',     p:[0, 1.30, 0.30], r:[0.38, 0.22, 0.18], ex:['杠铃卧推','上斜哑铃推举','哑铃飞鸟','双杠臂屈伸'], state:'trained', recovery:0.05, paired:false },
  { id:'upper_chest',s:'上胸',cn:'胸大肌上部', p:[0, 1.48, 0.28], r:[0.30, 0.13, 0.14], ex:['上斜卧推','上斜飞鸟'], state:'trained', recovery:0.05, paired:false },
  { id:'front_delt', s:'前束',cn:'三角肌前束', p:[0.34, 1.58, 0.16], r:[0.12, 0.13, 0.14], ex:['推举','前平举','阿诺德推举'], state:'trained', recovery:0.05, paired:true },
  { id:'side_delt',  s:'中束',cn:'三角肌中束', p:[0.44, 1.46, 0.08], r:[0.12, 0.16, 0.16], ex:['侧平举','绳索外展'], state:'recovering', recovery:0.55, paired:true },
  { id:'biceps',     s:'二头',cn:'肱二头肌',   p:[0.42, 1.26, 0.18], r:[0.12, 0.20, 0.14], ex:['弯举','锤式弯举','牧师椅弯举'], state:'recovering', recovery:0.60, paired:true },
  { id:'forearms',   s:'前臂',cn:'前臂肌群',   p:[0.45, 0.92, 0.14], r:[0.10, 0.18, 0.12], ex:['腕弯举','反握弯举'], state:'ready', recovery:1.0, paired:true },
  { id:'abs',        s:'腹',  cn:'腹直肌',     p:[0, 1.00, 0.26], r:[0.20, 0.24, 0.12], ex:['卷腹','悬垂举腿','平板支撑'], state:'ready', recovery:1.0, paired:false },
  { id:'obliques',   s:'腹斜',cn:'腹外斜肌',   p:[0.28, 1.06, 0.20], r:[0.10, 0.22, 0.12], ex:['俄罗斯转体','侧卷腹'], state:'ready', recovery:1.0, paired:true },
  { id:'quads',      s:'股四',cn:'股四头肌',   p:[0.15, 0.45, 0.18], r:[0.14, 0.32, 0.16], ex:['深蹲','腿举','腿屈伸','箭步蹲'], state:'ready', recovery:1.0, paired:true },

  // BACK
  { id:'rear_delt',  s:'后束',cn:'三角肌后束', p:[0.34, 1.48, -0.20], r:[0.11, 0.13, 0.12], ex:['俯身飞鸟','反向飞鸟','面拉'], state:'ready', recovery:1.0, paired:true },
  { id:'triceps',    s:'三头',cn:'肱三头肌',   p:[0.42, 1.26, -0.18], r:[0.12, 0.20, 0.13], ex:['臂屈伸','绳索下压','仰卧臂屈伸'], state:'trained', recovery:0.05, paired:true },
  { id:'traps',      s:'斜方',cn:'斜方肌',     p:[0, 1.62, -0.14], r:[0.22, 0.11, 0.12], ex:['耸肩','直立划船'], state:'ready', recovery:1.0, paired:false },
  { id:'lats',       s:'背阔',cn:'背阔肌',     p:[0.32, 1.20, -0.24], r:[0.14, 0.30, 0.12], ex:['引体向上','高位下拉','坐姿划船'], state:'recovering', recovery:0.50, paired:true },
  { id:'lower_back', s:'下背',cn:'竖脊肌',     p:[0, 0.90, -0.22], r:[0.18, 0.18, 0.10], ex:['硬拉','罗马尼亚硬拉'], state:'ready', recovery:1.0, paired:false },
  { id:'glutes',     s:'臀',  cn:'臀大肌',     p:[0, 0.76, -0.24], r:[0.30, 0.16, 0.18], ex:['深蹲','臀推','臀桥'], state:'ready', recovery:1.0, paired:false },
  { id:'hamstrings', s:'腘绳',cn:'腘绳肌',     p:[0.15, 0.45, -0.18], r:[0.13, 0.32, 0.14], ex:['罗马尼亚硬拉','腿弯举'], state:'ready', recovery:1.0, paired:true },
  { id:'calves',     s:'小腿',cn:'腓肠肌',     p:[0.15, 0.12, -0.10], r:[0.12, 0.22, 0.14], ex:['站姿提踵','坐姿提踵'], state:'ready', recovery:1.0, paired:true },
];

function makeMuscle(m, xPos) {
  const [rx,ry,rz] = m.r;
  const geom = new THREE.SphereGeometry(1, 28, 20);
  geom.scale(rx, ry, rz);
  const c = STATE_HEX[m.state];
  const mat = new THREE.MeshStandardMaterial({
    color: c, emissive: c,
    emissiveIntensity: m.state === 'trained' ? 0.7 : (m.state === 'recovering' ? 0.5 : 0.35),
    roughness: 0.4, metalness: 0.15
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(xPos, m.p[1], m.p[2]);
  mesh.castShadow = true;
  mesh.userData.def = m;
  return mesh;
}

function updateMuscleColor(id, state) {
  const meshes = Array.isArray(muscles[id]) ? muscles[id] : [muscles[id]];
  const c = STATE_HEX[state];
  for (const m of meshes) {
    m.material.color.setHex(c);
    m.material.emissive.setHex(c);
    m.material.emissiveIntensity = state === 'trained' ? 0.7 : (state === 'recovering' ? 0.5 : 0.35);
  }
}

function buildBody() {
  if (bodyGroup) disposeGroup(bodyGroup);
  bodyGroup = new THREE.Group();
  scene.add(bodyGroup);

  const isF = gender === 'female';
  const skin = isF ? 0xDDB89A : 0xC99878;
  const joint = 0x8B6F4E;
  const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.7, metalness: 0 });
  const jointMat = new THREE.MeshStandardMaterial({ color: joint, roughness: 0.6, metalness: 0.1 });

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), skinMat);
  head.position.set(0, 1.85, 0);
  head.castShadow = true;
  bodyGroup.add(head);

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.10, 16), skinMat);
  neck.position.set(0, 1.71, 0);
  bodyGroup.add(neck);

  // Torso - smaller so muscles bulge clearly
  const torsoTop = isF ? 0.22 : 0.26;
  const torsoBot = isF ? 0.24 : 0.24;
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(torsoTop, torsoBot+0.02, 0.36, 24), skinMat);
  upper.position.set(0, 1.42, 0);
  upper.castShadow = true;
  bodyGroup.add(upper);

  const lower = new THREE.Mesh(new THREE.CylinderGeometry(torsoBot+0.02, torsoBot+0.04, 0.34, 24), skinMat);
  lower.position.set(0, 1.10, 0);
  lower.castShadow = true;
  bodyGroup.add(lower);

  const hips = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.22, 24), skinMat);
  hips.position.set(0, 0.80, 0);
  bodyGroup.add(hips);

  // Arms
  function makeArm(sign) {
    const g = new THREE.Group();
    const sh = new THREE.Mesh(new THREE.SphereGeometry(0.10, 16, 16), jointMat);
    sh.position.set(sign*0.28, 1.62, 0);
    g.add(sh);

    const ua = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.30, 16), skinMat);
    ua.position.set(sign*0.32, 1.42, 0);
    ua.rotation.z = sign*0.06;
    g.add(ua);

    const el = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), jointMat);
    el.position.set(sign*0.34, 1.26, 0);
    g.add(el);

    const fa = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.30, 16), skinMat);
    fa.position.set(sign*0.36, 1.07, 0);
    fa.rotation.z = sign*0.03;
    g.add(fa);

    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), skinMat);
    hand.scale.set(1, 1.2, 0.5);
    hand.position.set(sign*0.37, 0.90, 0);
    g.add(hand);
    return g;
  }
  bodyGroup.add(makeArm(-1));
  bodyGroup.add(makeArm(1));

  // Legs
  function makeLeg(sign) {
    const g = new THREE.Group();
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 0.50, 16), skinMat);
    thigh.position.set(sign*0.12, 0.50, 0);
    thigh.castShadow = true;
    g.add(thigh);

    const knee = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), jointMat);
    knee.position.set(sign*0.12, 0.24, 0);
    g.add(knee);

    const calf = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.05, 0.40, 16), skinMat);
    calf.position.set(sign*0.12, 0.05, 0);
    g.add(calf);

    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.05, 0.18), skinMat);
    foot.position.set(sign*0.12, -0.16, 0.05);
    g.add(foot);
    return g;
  }
  bodyGroup.add(makeLeg(-1));
  bodyGroup.add(makeLeg(1));

  // MUSCLES (overlay bulges)
  muscles = {};
  for (const m of MUSCLES) {
    if (m.paired) {
      muscles[m.id] = [makeMuscle(m, -Math.abs(m.p[0])), makeMuscle(m, Math.abs(m.p[0]))];
    } else {
      muscles[m.id] = makeMuscle(m, m.p[0]);
    }
  }
  for (const id in muscles) {
    const arr = Array.isArray(muscles[id]) ? muscles[id] : [muscles[id]];
    arr.forEach(m => bodyGroup.add(m));
  }
}

function setView(v) {
  document.getElementById('b-front').classList.toggle('on', v==='front');
  document.getElementById('b-back').classList.toggle('on', v==='back');
  camera.position.set(0, 1.3, v==='front' ? 4.5 : -4.5);
  controls.target.set(0, 1.2, 0);
  controls.update();
}

function setGender(g) {
  gender = g;
  document.getElementById('b-male').classList.toggle('on', g==='male');
  document.getElementById('b-female').classList.toggle('on', g==='female');
  buildBody();
}

function toggleSpin() {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('b-spin').classList.toggle('on', controls.autoRotate);
}

function showInfo(m) {
  const el = document.getElementById('info');
  el.classList.add('show');
  document.getElementById('i-name').textContent = m.cn;
  const hex = '#' + STATE_HEX[m.state].toString(16).padStart(6,'0');
  const se = document.getElementById('i-state');
  se.textContent = STATE_NAME[m.state];
  se.style.background = hex + '33';
  se.style.color = hex;
  document.getElementById('i-bar').style.width = (m.recovery*100)+'%';
  document.getElementById('i-pct').textContent =
    `恢复进度 ${Math.round(m.recovery*100)}% · ${m.state==='ready' ? '已就绪' : '预计 ' + Math.round((1-m.recovery)*48) + ' 小时'}`;
  document.getElementById('i-ex').innerHTML = m.ex.map(e => `<li>${e}</li>`).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1500);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>
